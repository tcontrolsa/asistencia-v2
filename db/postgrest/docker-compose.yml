# PostgREST 12 junto al PostgreSQL existente (192.168.10.129).
# Uso en el servidor:  docker compose --env-file ../../.env up -d
# Queda en el puerto PGRST_SERVER_PORT (3001 por defecto), al lado del Express (3000) hasta retirarlo.
services:
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    ports:
      - "${PGRST_SERVER_PORT:-3001}:3000"
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-api}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_PRE_REQUEST: private.verificar_sesion   # revoca sesiones (dispositivo, cambio de contraseña, rol)
      PGRST_DB_MAX_ROWS: "5000"
      PGRST_OPENAPI_MODE: "follow-privileges"   # anon solo ve en /  lo que puede usar
      PGRST_LOG_LEVEL: "warn"
