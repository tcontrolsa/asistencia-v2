# PostgREST 12 junto al PostgreSQL existente (192.168.10.129).
# Uso en el servidor:  docker compose --env-file ../../.env up -d
# Queda en el puerto PGRST_SERVER_PORT (3001 por defecto), al lado del Express (3000) hasta retirarlo.
services:
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    ports:
      - "${PGRST_SERVER_PORT:-3001}:3000"
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-api}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_PRE_REQUEST: private.verificar_sesion   # revoca sesiones (dispositivo, cambio de contraseña, rol)
      PGRST_DB_MAX_ROWS: "5000"
      PGRST_OPENAPI_MODE: "follow-privileges"   # anon solo ve en /  lo que puede usar
      PGRST_LOG_LEVEL: "warn"

  # Worker de la Fase 6: tareas programadas (00:05, 00:30, aviso de no registro), WhatsApp y Google Sheets.
  # Arranca en modo simulación salvo que WHATSAPP_MODO=real.
  worker:
    build: ../../worker
    restart: unless-stopped
    environment:
      WORKER_DB_URI: ${WORKER_DB_URI}
      WHATSAPP_MODO: ${WHATSAPP_MODO:-simulacion}
      OPENWA_URL: ${OPENWA_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESION: ${OPENWA_SESION:-}
      WHATSAPP_SOLO_NUMEROS: ${WHATSAPP_SOLO_NUMEROS:-}
      # Google Sheets: JSON de la cuenta de servicio en base64 (sin montar carpetas: funciona también desde una
      # carpeta de red de Windows, donde Docker no puede montar volúmenes)
      GOOGLE_CREDENCIALES_B64: ${GOOGLE_CREDENCIALES_B64:-}
      SHEETS_ID: ${SHEETS_ID:-}
